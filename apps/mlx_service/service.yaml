deployment:
  # 可选值：
  # single           单进程：一个服务同时管理 type / material-standard
  # gateway_serial   多 worker + gateway，全局串行
  # gateway_parallel 多 worker + gateway，按 worker 并行
  mode: single

service:
  # 最多同时保留几个已加载模型。single 模式需要同时管理 type / material-standard / coder 时建议为 3。
  max_loaded_models: 4
  # 模型空闲多久后自动卸载。1800 秒 = 30 分钟；设置为 0 可关闭自动休眠。
  idle_timeout_seconds: 1800
  # 后台检查空闲模型的间隔。60 秒表示最多延迟约一分钟触发卸载。
  idle_check_interval_seconds: 60

single:
  host: 0.0.0.0
  port: 8200
  models:
    - type
    - material-standard
    - material-standard-v2
    - coder
    - size-thick-pressure

workers:
  type_worker:
    host: 0.0.0.0
    port: 8201
    timeout_seconds: 300
    models:
      - type

  material_worker:
    host: 0.0.0.0
    port: 8202
    timeout_seconds: 300
    models:
      - material-standard

  coder_worker:
    host: 0.0.0.0
    port: 8203
    timeout_seconds: 300
    models:
      - coder

gateway:
  host: 0.0.0.0
  port: 8200

models:
  # 提示词从独立 UTF-8 文件读取。相对路径按本 service.yaml 所在目录解析。
  # 启动服务前必须为每个启用模型填写 prompt_file。
  type:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-8b-type0807-mlx-q8
    prompt_file: "prompt/种类微调提示词.txt"
    max_tokens: 256
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true

  material-standard:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-8b-materialStandard0807-mlx-q8
    prompt_file: "prompt/材质规范微调提示词.txt"
    max_tokens: 256
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true

  coder:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-4b-coder0723-mlx-q8
    prompt_file: "prompt/编码提示词.txt"
    max_tokens: 512
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true
  
  size-thick-pressure:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-8b-SizeThickPressure_0811
    prompt_file: "prompt/尺寸壁厚磅级提示词.txt"
    max_tokens: 512
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true
