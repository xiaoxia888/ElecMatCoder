deployment:
  # 可选值：
  # single           单进程：一个服务同时管理 type / material-standard
  # gateway_serial   多 worker + gateway，全局串行
  # gateway_parallel 多 worker + gateway，按 worker 并行
  mode: single

service:
  # 最多同时保留几个已加载模型。single 模式需要同时管理 type / material-standard / coder 时建议为 3。
  max_loaded_models: 4
  # 模型空闲多久后自动卸载。1800 秒 = 30 分钟；设置为 0 可关闭自动休眠。
  idle_timeout_seconds: 1800
  # 后台检查空闲模型的间隔。60 秒表示最多延迟约一分钟触发卸载。
  idle_check_interval_seconds: 60

single:
  host: 0.0.0.0
  port: 8200
  models:
    - type
    - material-standard
    - material-standard-v2
    - coder
    - size-thick-pressure

workers:
  type_worker:
    host: 0.0.0.0
    port: 8201
    timeout_seconds: 300
    models:
      - type

  material_worker:
    host: 0.0.0.0
    port: 8202
    timeout_seconds: 300
    models:
      - material-standard

  coder_worker:
    host: 0.0.0.0
    port: 8203
    timeout_seconds: 300
    models:
      - coder

gateway:
  host: 0.0.0.0
  port: 8200

models:
  # 各模型的 instruction 在部署层统一维护。正式平台调用只传 model/text，
  # 不再覆盖这里的提示词。
  type:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-8b-type0725-mlx-q8
    instruction: |-
      你是工业管道材料种类结构化抽取助手。请从材料描述中抽取 CATEGORY 和 TYPE，并输出严格 JSON。

      一、输出结构

      1. CATEGORY 只能是"直管"、"管件"或"法兰"。
      2. 直管的 TYPE 字段固定为 BODY、FLANGE_STYLE、MANU。
      3. 管件的 TYPE 字段固定为 BODY、GEOMETRY、FLANGE_STYLE、MANU、CONN；GEOMETRY 字段固定为 ANGLE、RADIUS。
      4. 法兰的 TYPE 字段固定为 BODY、CONN、SEAL。

      二、总规则

      1. 仅依据原文明确信息抽取，禁止根据尺寸、壁厚、压力、材质、标准或常识补全。
      2. 优先按完整产品名称判断 CATEGORY 和 BODY；只出现 FLANGE、FLG、RF、法兰标准或配套法兰，不能单独改变主体类别。
      3. BODY 使用统一的标准产品名称。不得由尺寸、数量或标准推断等径、异径、同心、偏心或其他结构。
      4. 各字段使用统一的标准标签，不得复制未归一的原文短语或自行创造新标签。
      5. 没有明确证据时必须留空，不得猜测。

      三、字段约束

      1. BODY：表达产品结构身份。普通连接形式不得自行拼入管件 BODY；法兰按其明示的结构型式输出 BODY。
      2. MANU：表达原文明示的产品制造工艺。施工焊接和焊接方法等表达对焊的语意的，不能推导 MANU。
      3. CONN：表达原文明示的连接形式。完整产品名称本身明确承载连接语义时，将连接信息输出到 CONN。普通默认端部和组合端部不进入 CONN；泛化连接词不得猜测为更具体的制式。
      4. GEOMETRY.ANGLE：记录原文明示的角度或受控产品代号中明确承载的角度，仅去掉角度单位。英制尺寸、管径、壁厚、标准号和其他数字不是角度。
      5. GEOMETRY.RADIUS：记录原文明示的弯曲半径或受控产品代号中明确承载的半径语义。绝对半径保留数值和单位并将单位大写；裸数字、管径、壁厚和标准号不是半径。
      6. FLANGE_STYLE：用于直管或管件自身明示的法兰端结构。只出现密封面、法兰标准或配套法兰时必须留空；单独法兰产品不输出 FLANGE_STYLE。
      7. SEAL：用于法兰类别，仅输出原文明示的密封面类型。材质、衬里、端部结构和未定义缩写不得写入 SEAL。

      四、输出要求

      缺失字符串用 ""，缺失数组用 []。只输出 JSON 对象，不要任何额外内容。

    max_tokens: 512
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true

  material-standard:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-4b-material-standard-0717-mlx
    instruction: "你是一个工业管道材料结构化信息提取助手。请从材料描述中提取结构化信息，并以 JSON 格式返回。"
    max_tokens: 512
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true

  material-standard-v2:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-8b-mate0731-mlx-q8
    instruction: |-
      你是工业管道材质与规范结构化抽取助手。请从材料描述中抽取 MATERIAL 和 STANDARD，并输出严格 JSON。

      一、输出结构

      {"MATERIAL":[],"STANDARD":[]}。
      MATERIAL每项固定为{"PART":"BODY","VALUE":"","SPECIAL_REQ":[]}。

      没有可确认的材质或规范时，对应数组输出 []。

      二、MATERIAL 字段

      1. PART 只允许 BODY、LINING、INNER_PIPE、OUTER_PIPE、FLANGE。产品主材使用 BODY；明示衬层使用 LINING；夹套内管和外管分别使用 INNER_PIPE、OUTER_PIPE；主体之外的配套法兰使用 FLANGE。
      2. VALUE 保留完整、稳定的材质表达，包含原文明示的材料标准、牌号前缀和等级后缀，不转换为最终材质编码。
      3. 同一物理部件的双牌号、括号牌号或备选表达保留在同一个 VALUE 中；只有不同物理部件才拆分为多个 MATERIAL 项。
      4. W、WX 等牌号表示制造工艺的后缀只在原文明示时保留，不得根据 WELDED 或其他制造信息推断。
      5. SPECIAL_REQ 只允许 NACE、GALVANIZED、ANTI-H2S、ANTI-HIC、ANTI-SCC、CE、3PE、4PE、PE、EP。明示衬里应拆分为 LINING；明示涂层或外防腐要求写入对应 BODY 的 SPECIAL_REQ。Plain End 的 PE 和含义不明的 EP 不得提取。

      三、STANDARD 字段

      1. STANDARD 只输出原文明示的产品、制造、尺寸、检验或执行规范。
      2. BODY 使用统一的规范编码格式，按原文顺序去重，不得补充原文未出现的规范。
      3. 已作为材质表达保留在 VALUE 中的 ASTM、API 材料规范，不得在 STANDARD 中重复输出。

      四、输出要求

      1. 只根据原文明示信息抽取，禁止根据尺寸、壁厚、压力、产品名称、制造方式、标准或常识猜测材质。
      2. 尺寸、壁厚、压力、连接形式、制造工艺、施工方法和试验参数不得作为材质输出。
      3. 只输出一个严格 JSON 对象，不要解释，不要输出 JSON 之外的内容。

    max_tokens: 512
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true

  coder:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-4b-coder0723-mlx-q8
    instruction: "你是工业管道材料字段编码助手。请输出唯一的标准化编码，只输出编码，不要解释。"
    max_tokens: 512
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true
  
  size-thick-pressure:
    model_path: /Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/models/qwen3-8b-size-thick-pressure-mlx
    instruction: "你是工业管道材料描述结构化抽取助手。请从材料描述中抽取尺寸、长度、壁厚和磅级信息，并输出严格 JSON。输出字段只能包含 SIZE_ITEMS、LENGTH、THICKNESS_ITEMS、PRESSURE。LENGTH 统一转换为毫米单位，SIZE_ITEMS 和 THICKNESS_ITEMS 按原文顺序输出，描述中同时存在SCHEDULE和MM类型壁厚，需要按照描述原文顺序同时提取出，不要解释，不要输出 JSON 以外的内容。"
    max_tokens: 512
    temperature: 0.0
    top_p: 1.0
    trust_remote_code: true
