# 双RTX 4090 24GB：8B和4B基座各占一张卡。
engines:
  # 单卡非量化Qwen3.5-9B。仅当service.yaml中的模型路由引用它时启动。
  qwen35_9b:
    cuda_visible_devices: "0"
    dtype: bfloat16
    max_model_len: 1024
    gpu_memory_utilization: 0.94
    tensor_parallel_size: 1
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: true
    quantization: ""
    kv_cache_dtype: auto
    cpu_offload_gb: 0
    # 云端运行镜像通常没有完整 g++/cc1plus；关闭需要 JIT 编译的采样器。
    environment:
      VLLM_USE_FLASHINFER_SAMPLER: "0"
