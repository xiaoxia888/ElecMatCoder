profile: single-3090

gateway:
  host: 0.0.0.0
  port: 8200
  request_timeout_seconds: 600
  startup_timeout_seconds: 1200
  health_check_interval_seconds: 2

engines:
  eval_engine:
    host: 127.0.0.1
    port: 8301
    model_path: /home/waas/base-models/Qwen3-8B
    served_model_name: qwen3-8b-eval-base
    trust_remote_code: true
    max_loras: 2
    max_cpu_loras: 2
    max_lora_rank: 32
    lora_modules:
      type: /home/waas/lora/checkpoint-0807-种类
      size-thick-pressure: /home/waas/lora/checkpoint-3000-尺寸

models:
  type:
    engine: eval_engine
    upstream_model: type
    prompt_file: prompts/种类微调提示词.txt
    max_tokens: 128
    temperature: 0.0
    top_p: 1.0
    chat_template_kwargs: {enable_thinking: false}

  size-thick-pressure:
    engine: eval_engine
    upstream_model: size-thick-pressure
    prompt_file: prompts/尺寸壁厚磅级提示词.txt
    max_tokens: 256
    temperature: 0.0
    top_p: 1.0
    chat_template_kwargs: {enable_thinking: false}
