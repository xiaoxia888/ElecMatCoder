# Linux NVIDIA部署示例。把基座和LoRA路径替换为服务器实际路径。
# 硬件参数来自profiles目录；启动时无需再传--profile。
profile: dual-3090

gateway:
  host: 0.0.0.0
  port: 8200
  request_timeout_seconds: 600
  startup_timeout_seconds: 1200
  health_check_interval_seconds: 3

engines:
  qwen3_8b:
    host: 127.0.0.1
    port: 8301
    model_path: /home/waas/base-models/Qwen3-8B
    served_model_name: qwen3-8b-base
    trust_remote_code: true
    max_loras: 1
    max_cpu_loras: 1
    max_lora_rank: 16
    lora_modules:
      type: /home/waas/lora/checkpoint-2250-种类

  qwen3_4b:
    host: 127.0.0.1
    port: 8302
    model_path: /home/waas/base-models/Qwen3-4B-Instruct-2507
    served_model_name: qwen3-4b-base
    trust_remote_code: true
    # 一阶段尺寸和材质需要同时进入批次；3为编码LoRA也预留容量。
    max_loras: 3
    max_cpu_loras: 3
    max_lora_rank: 16
    lora_modules:
      size-thick-pressure: /home/waas/lora/size-thick-pressure
      material-standard: /home/waas/lora/checkpoint-8500-材质规范v3
      coder: /home/waas/lora/coder

models:
  type:
    engine: qwen3_8b
    upstream_model: type
    instruction: |-
      你是工业管道材料种类结构化抽取助手。请从材料描述中抽取 CATEGORY 和 TYPE，并输出严格 JSON。

      一、输出结构

      1. CATEGORY 只能是"直管"、"管件"或"法兰"。
      2. 直管的 TYPE 字段固定为 BODY、FLANGE_STYLE、MANU。
      3. 管件的 TYPE 字段固定为 BODY、GEOMETRY、FLANGE_STYLE、MANU、CONN；GEOMETRY 字段固定为 ANGLE、RADIUS。
      4. 法兰的 TYPE 字段固定为 BODY、CONN、SEAL。

      二、总规则

      1. 仅依据原文明确信息抽取，禁止根据尺寸、壁厚、压力、材质、标准或常识补全。
      2. 优先按完整产品名称判断 CATEGORY 和 BODY；只出现 FLANGE、FLG、RF、法兰标准或配套法兰，不能单独改变主体类别。
      3. BODY 使用统一的标准产品名称。不得由尺寸、数量或标准推断等径、异径、同心、偏心或其他结构。
      4. 各字段使用统一的标准标签，不得复制未归一的原文短语或自行创造新标签。
      5. 没有明确证据时必须留空，不得猜测。

      三、字段约束

      1. BODY：表达产品结构身份。普通连接形式不得自行拼入管件 BODY；法兰按其明示的结构型式输出 BODY。
      2. MANU：表达原文明示的产品制造工艺。施工焊接和焊接方法等表达对焊的语意的，不能推导 MANU。
      3. CONN：表达原文明示的连接形式。完整产品名称本身明确承载连接语义时，将连接信息输出到 CONN。普通默认端部和组合端部不进入 CONN；泛化连接词不得猜测为更具体的制式。
      4. GEOMETRY.ANGLE：记录原文明示的角度或受控产品代号中明确承载的角度，仅去掉角度单位。英制尺寸、管径、壁厚、标准号和其他数字不是角度。
      5. GEOMETRY.RADIUS：记录原文明示的弯曲半径或受控产品代号中明确承载的半径语义。绝对半径保留数值和单位并将单位大写；裸数字、管径、壁厚和标准号不是半径。
      6. FLANGE_STYLE：用于直管或管件自身明示的法兰端结构。只出现密封面、法兰标准或配套法兰时必须留空；单独法兰产品不输出 FLANGE_STYLE。
      7. SEAL：用于法兰类别，仅输出原文明示的密封面类型。材质、衬里、端部结构和未定义缩写不得写入 SEAL。

      四、输出要求

      缺失字符串用 ""，缺失数组用 []。只输出 JSON 对象，不要任何额外内容。
    # 训练集中的种类 JSON 最长约 64 tokens，128 足够且避免挤占输入上下文。
    max_tokens: 128
    temperature: 0.0
    top_p: 1.0
    extra_body:
      bad_words:
        - "<think>"
        - "</think>"

  size-thick-pressure:
    engine: qwen3_4b
    upstream_model: size-thick-pressure
    instruction: "你是工业管道材料描述结构化抽取助手。请从材料描述中抽取尺寸、长度、壁厚和磅级信息，并输出严格 JSON。输出字段只能包含 SIZE_ITEMS、LENGTH、THICKNESS_ITEMS、PRESSURE。LENGTH 统一转换为毫米单位，SIZE_ITEMS 和 THICKNESS_ITEMS 按原文顺序输出，描述中同时存在SCHEDULE和MM类型壁厚，需要按照描述原文顺序同时提取出，不要解释，不要输出 JSON 以外的内容。"
    max_tokens: 256
    temperature: 0.0
    top_p: 1.0
    extra_body:
      bad_words:
        - "<think>"
        - "</think>"

  material-standard:
    engine: qwen3_4b
    upstream_model: material-standard
    instruction: |-
      你是工业管道材质与规范抽取模型。仅提取原文明示信息，禁止猜测；只输出严格JSON，不要解释。

      输出固定为：{"MATERIAL":[],"STANDARD":[]}。
      MATERIAL每项固定为{"PART":"BODY","VALUE":"","SPECIAL_REQ":[]}。PART只允许BODY、LINING、INNER_PIPE、OUTER_PIPE、FLANGE：主材用BODY，明确衬层用LINING，夹套内外管分别使用INNER_PIPE和OUTER_PIPE，主体之外的配套法兰才使用FLANGE。
      VALUE保留完整、稳定的原始材质表达及原文明示的材料标准或牌号前缀，不转换成最终编码。同一物理部件的双牌号、括号或备选表达保留在一个VALUE中；仅不同物理部件拆项。
      SPECIAL_REQ只允许NACE、GALVANIZED、ANTI-H2S、ANTI-HIC、ANTI-SCC、CE、3PE、4PE、PE、EP。明确衬里拆为LINING；明确涂层或外防腐写入BODY的SPECIAL_REQ。Plain End的PE和含义不明的EP不得提取。
      STANDARD每项固定为{"BODY":"规范编码"}，仅输出原文明示的产品、制造、尺寸、检验及执行规范，按训练数据中的项目编码格式归一并去重。已包含在VALUE中的ASTM、API材料规范不重复输出。
      忽略尺寸、壁厚、压力、连接、制造、施工和试验信息；无法确认时输出空数组。
    # v3 多部件材质 JSON 通常远低于 256 tokens；避免与 1024 上下文上限相加后溢出。
    max_tokens: 256
    temperature: 0.0
    top_p: 1.0
    extra_body:
      bad_words:
        - "<think>"
        - "</think>"

  coder:
    engine: qwen3_4b
    upstream_model: coder
    instruction: "你是工业管道材料字段编码助手。请输出唯一的标准化编码，只输出编码，不要解释。"
    max_tokens: 128
    temperature: 0.0
    top_p: 1.0
    extra_body:
      bad_words:
        - "<think>"
        - "</think>"
