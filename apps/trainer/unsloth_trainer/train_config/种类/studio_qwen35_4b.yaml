# Unsloth Studio: Qwen3.5-4B / RTX 4090 / BF16 LoRA
# 模型、训练方式和数据集仍需在 Studio 页面选择：
#   Model: Qwen3.5-4B
#   Method: LoRA（不要选择 QLoRA）
#   Dataset format: alpaca (instruction/input/output)
#   Eval split: validation

training:
  max_seq_length: 1024
  num_epochs: 2
  learning_rate: 0.00002  # 等于 2e-5；使用小数形式确保 Studio 按浮点数解析
  embedding_learning_rate: null
  batch_size: 2
  gradient_accumulation_steps: 8
  warmup_steps: 91
  max_steps: 0
  save_steps: 200
  eval_steps: 200
  weight_decay: 0.01
  random_seed: 2026
  packing: false
  train_on_completions: true
  gradient_checkpointing: unsloth
  optim: adamw_8bit
  lr_scheduler_type: cosine

lora:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false
  use_loftq: false
  use_dora: false

logging:
  enable_wandb: false
  wandb_project: llm-finetuning
  enable_tensorboard: false
  tensorboard_dir: runs
  log_frequency: 20
