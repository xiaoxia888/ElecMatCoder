# 冒烟测试：材质与规范抽取 / Qwen3.5-9B / RTX 5090 32GB / BF16 LoRA。
# 只训练 2 步，不评估、不保存中间 checkpoint，但训练结束仍会保存 final_adapter。
# 该配置用于验证模型加载、LoRA、前向、反向和最终保存链路。

model:
  name_or_path: "/openbayes/home/base-models/Qwen3.5-9B"
  max_seq_length: 1024
  load_in_4bit: false
  load_in_8bit: false
  load_in_16bit: true
  full_finetuning: false
  fast_inference: false

data:
  format: "alpaca"
  train_file: "/openbayes/input/input1/材质规范/材质规范_train.json"
  validation_file: null
  num_proc: 8
  enable_thinking: false
  train_on_responses_only: true

training:
  output_dir: "/openbayes/home/unsloth/outputs/unsloth_qwen35_9b/material_rtx5090_smoke"
  num_train_epochs: 1.0
  max_steps: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.00002
  warmup_ratio: 0.0
  warmup_steps: 0
  logging_steps: 1
  eval_strategy: "no"
  save_strategy: "no"
  load_best_model_at_end: false
  dataloader_num_workers: 0
  report_to: "none"
  resume_from_checkpoint: null

save:
  plot_training_curves: false
  merged_16bit: false
  gguf: false
