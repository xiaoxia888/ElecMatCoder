# Unsloth Studio: 材质规范 / Qwen3.5-9B / RTX 4090 24GB / BF16 LoRA
#
# 本文件只导入训练和 LoRA 参数。Studio 页面中另外选择：
#   Model: /data/MaterialsCode/base-models/Qwen3.5-9B
#   Method: LoRA（BF16，不是 QLoRA/4-bit）
#   Train dataset: 材质规范_train.json
#   Eval dataset: 材质规范_val.json
#   Dataset format: Alpaca（instruction/input/output）
#   Run: 新建训练，不恢复之前报错的 checkpoint
# 模型、数据集、输出目录和日志目录均由 Studio 管理。

training:
  max_seq_length: 1024
  num_epochs: 2
  learning_rate: 0.00002
  batch_size: 1
  gradient_accumulation_steps: 16  # 有效 batch=16
  warmup_steps: 262  # 约为 8716 个优化步的 3%
  max_steps: 0  # 按 num_epochs 训练
  save_steps: 500
  eval_steps: 500
  weight_decay: 0.01
  random_seed: 2026
  packing: false
  train_on_completions: true
  gradient_checkpointing: unsloth
  optim: adamw_8bit
  lr_scheduler_type: cosine

lora:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false
  use_loftq: false
  use_dora: false
  # Qwen3.5 是统一多模态架构，本任务仅训练文本语言部分。
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
