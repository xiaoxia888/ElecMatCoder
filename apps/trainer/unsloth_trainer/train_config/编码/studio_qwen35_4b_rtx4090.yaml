# Unsloth Studio: 编码 / Qwen3.5-4B / RTX 4090 / BF16 LoRA
# 实际数据：train=4415，val=549；总文本最大 166 字符，输出中位数仅 5 字符。
# 短序列使用 256 tokens 和更大物理 batch。尾批次补齐 1 条到 4416。
# Studio 页面选择：Qwen3.5-4B、LoRA、Alpaca、coder_stage2_train.json、coder_stage2_val.json。

training:
  max_seq_length: 256
  num_epochs: 3  # 小规模映射任务增加一轮覆盖
  learning_rate: 0.00002
  embedding_learning_rate: null
  batch_size: 8
  gradient_accumulation_steps: 2  # 有效 batch=16
  warmup_steps: 25  # 828 总优化步数的约 3%
  max_steps: 0
  save_steps: 50
  eval_steps: 50
  weight_decay: 0.01
  random_seed: 2026
  packing: false
  train_on_completions: true
  gradient_checkpointing: unsloth
  optim: adamw_8bit
  lr_scheduler_type: cosine

lora:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false
  use_loftq: false
  use_dora: false

logging:
  enable_wandb: false
  wandb_project: field-coding
  enable_tensorboard: false
  tensorboard_dir: runs/coder/rtx4090
  log_frequency: 10
