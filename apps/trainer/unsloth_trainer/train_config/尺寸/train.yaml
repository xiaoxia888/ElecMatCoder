# 尺寸/壁厚/压力等级抽取模型：日常只需要确认下面 5 项。
finetuning_method: "lora"  # lora=16-bit；qlora=4-bit省显存；full=全参数
base_model: "/root/autodl-fs/llm/base-models/Qwen3.5-9B"
train_dataset: "/root/autodl-fs/llm/datasets/尺寸壁厚磅级/0817/尺寸壁厚磅级_train.json"
validation_dataset: "/root/autodl-fs/llm/datasets/尺寸壁厚磅级/0817/尺寸壁厚磅级_val.json"
output_dir: "/root/autodl-fs/llm/lora/size0901"

# 本任务专属的训练参数。
training:
  num_train_epochs: 1.0
