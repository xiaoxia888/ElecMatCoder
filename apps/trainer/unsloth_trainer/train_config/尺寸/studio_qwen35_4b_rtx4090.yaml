# Unsloth Studio: 尺寸/壁厚/磅级 / Qwen3.5-4B / RTX 4090 / BF16 LoRA
# 实际数据：train=49298，val=5540；最长原始文本 1414 字符，输出最长 347 字符。
# 使用 1024 tokens 保留完整规则与多项 JSON。尾批次规避目标：补齐 14 条到 49312。
# Studio 页面选择：Qwen3.5-4B、LoRA、Alpaca、0813/train.json、0813/val.json。

training:
  max_seq_length: 1024
  num_epochs: 2
  learning_rate: 0.00002
  embedding_learning_rate: null
  batch_size: 2
  gradient_accumulation_steps: 8  # 有效 batch=16
  warmup_steps: 185  # 6164 总优化步数的约 3%
  max_steps: 0
  save_steps: 400
  eval_steps: 400
  weight_decay: 0.01
  random_seed: 2026
  packing: false
  train_on_completions: true
  gradient_checkpointing: unsloth
  optim: adamw_8bit
  lr_scheduler_type: cosine

lora:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false
  use_loftq: false
  use_dora: false

logging:
  enable_wandb: false
  wandb_project: dimension-extraction
  enable_tensorboard: false
  tensorboard_dir: runs/dimension/rtx4090
  log_frequency: 20
