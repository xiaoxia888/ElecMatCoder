# 按最终规范主编码维护 OD -> DN 精确补充映射。
#
# 数据边界：
# 1. 只录入标准机构或制造商官方技术资料能够确认的尺寸。
# 2. EN 10357-A 本身按 OD 定义；其 DN 值采用与其尺寸相同的
#    DIN 11866-A nominal size，用于本系统的工程换算。
# 3. DIN 17455、DIN 17457、EN 10217-7、EN 10296-2、EN 10312 和
#    EN ISO 1127 属于交付条件或 OD/壁厚尺寸标准，不能仅凭规范号
#    唯一确定 DN，因此不得在此文件中强行配置。
#
# 依据：
# - DIN EN 10357:2022-10（DIN Media）
#   https://www.dinmedia.de/de/norm/din-en-10357/352773289
# - Alfa Laval Hygienic Fittings DIN EN 10357-A：
#   EN 10357-A = former DIN 11850 Reihe 2 = DIN 11866-A，并给出 DN/OD 表。
#   https://assets.alfalaval.com/documents/p1d5118c5/alfa-laval-hygienic-fittings-din-en-10357-a-product-leaflets-en-gb.pdf
# - DIN EN 10220:2003-03（DIN Media）
#   https://www.dinmedia.de/de/norm/din-en-10220/54122066
# - EN 10220 DN/OD 产品技术表（Aalberts hydronic flow control）
#   https://flamco.aalberts-hfc.com/media/files/documentation/doc_exp_dimensionsandweightstubes.pdf

# 项目中的 DIN 10357 作为 DIN EN 10357-A 的历史/简写编码处理。
