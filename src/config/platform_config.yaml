# ============================================================
# 材料智能处理平台 - 系统配置
# ============================================================

# ==================== 服务配置 ====================
server:
  host: "0.0.0.0"
  port: 8002
  reload: true

# ==================== NER识别配置 ====================
ner:
  # Qwen3 一阶段结构化抽取配置
  qwen3:
    adapter: "structured_llamafactory"  # structured_llamafactory / legacy
    backend: "hf_lazy_service"                   # ollama / transformers / hf_lazy_service
    model_name: "type"            # ollama 后端时使用的模型名
    ollama_url: "http://localhost:11434" # ollama 服务地址
    service_url: "http://192.168.31.201:8200" # hf_lazy_service 后端时使用的服务地址
    model_path: "/Users/guoxi/Desktop/workspace/NJNCC/python_code/ElecMatCoder/outputs/qwen3/contract_llm"     # transformers 后端时使用的模型路径
    device: "auto"                      # transformers 后端设备: auto / cpu / cuda / mps
    output_mode: "full"       # legacy 适配器使用；structured_llamafactory 可忽略
    num_predict: 512                   # 一阶段最大生成 token 数；结构复杂或输出被截断时调大
    temperature: 0.1                  # 生成随机性；越低越稳定。结构化抽取建议 0~0.2，正式环境推荐 0 或 0.1
    top_p: 0.9                         # nucleus sampling 截断阈值；仅在 temperature > 0 ，top_p 的值越高，生成的文本越多样、越有创意；值越低，生成的文本越确定、越保守。
    logprobs_enabled: true             # 是否向 Ollama 请求 logprobs 计算置信度；关闭后通常更快，但抽取置信度会退化为 1.0
    stage1:
      # ======================================================
      # 阶段一配置说明
      # ======================================================
      # 1. 每个字段都可以单独指定自己的模型配置，名字保持直观：
      #    type_models / material_model / standard_model / size_model / thickness_model / pressure_model
      # 2. backend 表示使用哪条后端路径。
      # 3. 与 backend 同名的子块，写该后端自己的参数。
      # 4. share_group 是“共享一次模型调用”的编排开关：
      #    只有多个字段真的共用同一个 predictor 时才有意义。
      #    例如 material_model 和 standard_model 共用一个结构化模型，就可以写同一个 share_group。
      # 5. 对于当前 SIZE / THICKNESS / PRESSURE 的提示词补提路径，
      #    虽然底层可能是同一个服务，但仍然是分别发起尺寸/壁厚/磅级请求，
      #    所以这里先不写 share_group，避免配置语义误导。
      router:
        enabled: false #是否开启分类模型，TYPE 走默认模型
        backend: "hybrid"   # rules / openai_compatible / hybrid
        base_url: "http://192.168.31.201:8085/v1"
        api_key: "ollama-local"
        api: "chat_completions"  # openai-completions / chat_completions
        model_name: "MiniMax-M2.5-Q5_K_M-00001-of-00005.gguf"
        timeout: 60
        temperature: 0.0
        max_tokens: 256
        direct_threshold: 0.9
        review_threshold: 0.7
        rules_direct_threshold: 0.92
        fallback_category: "特殊件"
        category_schema_path: "src/config/pipe_route_categories.json"
        encodable_categories: ["直管", "法兰", "管件"]
      type_models:
        # TYPE 按大类分模型。
        # 如果后续某个 TYPE 模型想和别的字段共用一次调用，也可以直接加 share_group。
        直管: 
          backend: "hf_lazy_service"
          hf_lazy_service:
            service_url: "http://192.168.31.201:8200"
            model_name: "type"
          # backend: "transformers"
          # model_path: "/Users/guoxi/Desktop/workspace/NJNCC/python_code/LlamaFactory/saves/qwen3-4b-base/lora/pipe"
          # device: "mps"
          # temperature: 0.1
        法兰: 
          backend: "hf_lazy_service"
          hf_lazy_service:
            service_url: "http://192.168.31.201:8200"
            model_name: "type"
          # backend: "transformers"
          # model_path: "/Users/guoxi/Desktop/workspace/NJNCC/python_code/LlamaFactory/saves/qwen3-4b-base/lora/flang"
          # device: "mps"
          # temperature: 0.1
        管件: 
          backend: "hf_lazy_service"
          hf_lazy_service:
            service_url: "http://192.168.31.201:8200"
            model_name: "type"
          # backend: "transformers"
          # model_path: "/Users/guoxi/Desktop/workspace/NJNCC/python_code/LlamaFactory/saves/qwen3-4b-base/lora/fittings"
          # device: "mps"
          # temperature: 0.1

      material_model: 
        # MATERIAL 抽取模型。
        # 与 standard_model 写同一个 share_group，表示两者共用一次调用。
        backend: "hf_lazy_service"
        share_group: "material_standard"
        hf_lazy_service:
          service_url: "http://192.168.31.201:8200"
          model_name: "material-standard"
        # backend: "transformers"
        # model_path: "/Users/guoxi/Desktop/workspace/NJNCC/python_code/LlamaFactory/saves/qwen3-4b-base/lora/material"
        # device: "mps"
        # temperature: 0.1

      standard_model: 
        # STANDARD 抽取模型。
        # 这里与 material_model 共用同一个结构化模型。
        backend: "hf_lazy_service"
        share_group: "material_standard"
        hf_lazy_service:
          service_url: "http://192.168.31.201:8200"
          model_name: "material-standard"
        # backend: "transformers"
        # model_path: "/Users/guoxi/Desktop/workspace/NJNCC/python_code/LlamaFactory/saves/qwen3-4b-base/lora/standard"
        # device: "mps"
        # temperature: 0.1

      size_model:
        # SIZE 补提模型。
        # backend=openai_compatible:
        #   走提示词补提路径。
        # backend=hf_lazy_service:
        #   走本地微调结构字段模型路径。
        # 当 size_model / thickness_model / pressure_model 写相同 share_group 且配置一致时，
        # 会共用一次结构字段模型调用，返回 SIZE / THICKNESS / PRESSURE 三个结果。
        enabled: true
        backend: "hf_lazy_service"
        # share_group 相同且配置完全一致时，三字段共享一次模型调用。
        # 如果 share_group 相同但配置不一致，启动时会直接报错。
        share_group: "structural_fields"
        # openai_compatible:
        #   prompt_version: "v3"
        #   model_name: "MiniMax-M2.5-Q5_K_M-00001-of-00005.gguf"
        #   base_url: "http://192.168.31.201:8085/v1"
        #   api_key: "ollama-local"
        #   api: "chat_completions"
        #   timeout: 60
        #   temperature: 0.0
        #   max_tokens: 768
        #   max_workers: 1
        hf_lazy_service:
          service_url: "http://192.168.31.201:8200"
          model_name: "size-thick-pressure"
          max_new_tokens: 512
          temperature: 0.0

      thickness_model:
        # THICKNESS 补提模型。
        enabled: true
        backend: "hf_lazy_service"
        share_group: "structural_fields"
        # openai_compatible:
        #   prompt_version: "v3"
        #   model_name: "MiniMax-M2.5-Q5_K_M-00001-of-00005.gguf"
        #   base_url: "http://192.168.31.201:8085/v1"
        #   api_key: "ollama-local"
        #   api: "chat_completions"
        #   timeout: 60
        #   temperature: 0.0
        #   max_tokens: 768
        #   max_workers: 1
        hf_lazy_service:
          service_url: "http://192.168.31.201:8200"
          model_name: "size-thick-pressure"
          max_new_tokens: 512
          temperature: 0.0

      pressure_model:
        # PRESSURE 补提模型。
        enabled: true
        backend: "hf_lazy_service"
        share_group: "structural_fields"
        # openai_compatible:
        #   prompt_version: "v3"
        #   model_name: "MiniMax-M2.5-Q5_K_M-00001-of-00005.gguf"
        #   base_url: "http://192.168.31.201:8085/v1"
        #   api_key: "ollama-local"
        #   api: "chat_completions"
        #   timeout: 60
        #   temperature: 0.0
        #   max_tokens: 768
        #   max_workers: 1
        hf_lazy_service:
          service_url: "http://192.168.31.201:8200"
          model_name: "size-thick-pressure"
          max_new_tokens: 512
          temperature: 0.0
      structural_rules:
        enabled: true # 是否开启尺寸 / 壁厚 / 磅级规则器。规则器始终先跑，模型只补缺失字段。
# ==================== 编码规则配置 ====================
encoding:
  # 使用 Qwen3 微调模型统一编码
  method: "llm"

  # LLM 编码配置
  llm:  
    model_name: "coder"
    backend: "mlx_service"
    service_url: "http://192.168.31.201:8200"
    timeout: 300
    num_predict: 512
    temperature: 0.0
    top_p: 1.0
    # 二阶段编码兜底模型开关：
    # 只有这里显式列出的字段，在规则/映射失败后才允许进入兜底编码模型。
    # 可选字段：TYPE / SIZE / THICKNESS / PRESSURE / MATERIAL / STANDARD
    fallback_fields:
      - TYPE
      - MATERIAL
      - STANDARD
#      - THICKNESS
#      - SIZE
#      - PRESSURE

# ==================== 语义匹配配置 ====================
semantic_matching:
  similarity_threshold: 0.92
  # 模型名称（HuggingFace 模型名或本地路径）
  model_name: "paraphrase-multilingual-MiniLM-L12-v2"
  # 本地模型路径（相对于项目根目录，留空则从 HuggingFace 下载）
  local_model_path: "models/semantic_model_finetuned"
  top_k: 5
  cache_embeddings: true
  # 离线模式（不联网检查更新）
  offline_mode: true

# ==================== 批量处理配置 ====================
batch_processing:
  max_concurrent: 2
  progress_interval_ms: 100
  # 是否在任务列表展示「中途停止/失败」的任务（默认 false 只展示进行中与正常完成的任务，开启后也展示已取消/失败的任务）
  show_terminated_jobs: true
  # 批量任务后台维护。只负责清理历史数据，不负责执行/停止编码任务。
  maintenance:
    enabled: true
    # 历史清理不需要太频繁，默认 10 分钟检查一次。
    interval_seconds: 600
  # 批量任务历史保留策略。只清理非活跃任务，queued/running/cancelling 永不删除。
  history:
    keep_days: 7
    max_jobs: 200
  # 任务列表最多返回多少个任务。
  list_limit: 30

# ==================== 日志配置 ====================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# ==================== 氚云集成配置 ====================
h3yun:
  # 氚云 OpenAPI 地址
  url: "https://www.h3yun.com/OpenApi/Invoke"
  # 引擎编码
  engine_code: "ety58sf4upb95mibri9qatvi5"
  # 引擎密钥
  engine_secret: "u3toDgywMDwgbYgnrHNmjzH0g0fzn9mWAj0PY659taS7sxeVPoor5g=="
  # 请求超时时间（秒）
  timeout: 300
  # 批量导入每批数量
  batch_size: 500
